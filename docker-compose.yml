
services:
  frontend:
    container_name: task-frontend
    image: registry.gitlab.com/amawaidyarathne/cloud-task-platform/frontend:${IMAGE_TAG:-408579b9}
    restart: unless-stopped
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - task-network

  backend:
    container_name: task-backend
    image: registry.gitlab.com/amawaidyarathne/cloud-task-platform/backend:${IMAGE_TAG:-408579b9}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - task-network

  postgres:
    container_name: task-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - task-network

  nginx:
    container_name: task-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - task-network

networks:
  task-network:

volumes:
  postgres-data:
