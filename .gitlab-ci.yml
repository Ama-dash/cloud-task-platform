
stages:
  - test

frontend_lint:
  stage: test
  tags:
    - docker
  script:
    - cd frontend
    - npm ci
    - npm run lint

frontend_build:
  stage: test
  tags:
    - docker
  script:
    - cd frontend
    - npm ci
    - npm run build

backend_check:
  stage: test
  tags:
    - docker
  script:
    - cd backend
    - npm ci
    - node --check src/server.js
