
stages:
  - test
  - build
  - security

frontend_lint:
  stage: test
  tags:
    - docker
  script:
    - cd frontend
    - npm ci
    - npm run lint

frontend_build:
  stage: test
  tags:
    - docker
  script:
    - cd frontend
    - npm ci
    - npm run build

backend_check:
  stage: test
  tags:
    - docker
  script:
    - cd backend
    - npm ci
    - node --check src/server.js

docker_build_frontend:
  stage: build
  tags:
    - docker
  script:
    - docker version
    - docker build --pull -t cloud-task-platform-frontend:ci ./frontend

docker_build_backend:
  stage: build
  tags:
    - docker
  script:
    - docker version
    - docker build -t cloud-task-platform-backend:ci ./backend

trivy_frontend_scan:
  stage: security
  tags:
    - docker
  script:
    - '& "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\AquaSecurity.Trivy_Microsoft.Winget.Source_8wekyb3d8bbwe\trivy.exe" image --severity HIGH,CRITICAL --exit-code 1 cloud-task-platform-frontend:ci'


trivy_backend_scan:
  stage: security
  tags:
    - docker
  script:
    - '& "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\AquaSecurity.Trivy_Microsoft.Winget.Source_8wekyb3d8bbwe\trivy.exe" image --severity HIGH,CRITICAL --exit-code 1 cloud-task-platform-backend:ci'
