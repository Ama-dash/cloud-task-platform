
stages:
  - test
  - build

frontend_lint:
  stage: test
  tags:
    - docker
  script:
    - cd frontend
    - npm ci
    - npm run lint

frontend_build:
  stage: test
  tags:
    - docker
  script:
    - cd frontend
    - npm ci
    - npm run build

backend_check:
  stage: test
  tags:
    - docker
  script:
    - cd backend
    - npm ci
    - node --check src/server.js

docker_build_frontend:
  stage: build
  tags:
    - docker
  script:
    - docker version
    - docker build -t cloud-task-platform-frontend ./frontend

docker_build_backend:
  stage: build
  tags:
    - docker
  script:
    - docker version
    - docker build -t cloud-task-platform-backend ./backend